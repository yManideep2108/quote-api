name: Build Project

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Give Permission to mvnw
        run: chmod +x mvnw

      - name: Build Project
        run: ./mvnw clean package -DskipTests